

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Rutina B | Daniela Castillo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--text:#ffffff;
--muted:rgba(255,255,255,.78);
--soft:rgba(255,255,255,.06);
--soft-2:rgba(255,255,255,.09);
--border:rgba(255,255,255,.13);
--accent:#ff5a1f;
--accent-2:#ff8a3d;
--blue:#2f63ff;
--green:#35d062;
--shadow:0 14px 34px rgba(0,0,0,.32);
--wrap:min(1120px, calc(100% - 32px));
}
body{
min-height:100vh;
font-family:'Segoe UI',system-ui,sans-serif;
color:var(--text);
background:
linear-gradient(180deg, rgba(8,10,18,.40), rgba(8,10,18,.58)),
url('https://movesmart-chile.github.io/movesmart-web/imagenes/fondo-preview-rutina.webp') center center / cover no-repeat;
overflow-x:hidden;
}
body::before{
content:"";
position:fixed;
inset:0;
pointer-events:none;
background:
linear-gradient(90deg, rgba(4,6,14,.20), transparent 45%, rgba(255,90,31,.06)),
radial-gradient(circle at 50% 110%, rgba(255,255,255,.05), transparent 36%);
z-index:0;
}
.wrap{
width:var(--wrap);
margin:auto;
padding:30px 0 50px;
position:relative;
z-index:1;
}
.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:16px;
margin-bottom:24px;
}
.brand{
display:flex;
align-items:center;
gap:12px;
}
.brand-badge{
width:46px;
height:46px;
border-radius:15px;
display:grid;
place-items:center;
background:linear-gradient(135deg, var(--accent), var(--accent-2));
font-weight:900;
box-shadow:0 16px 34px rgba(255,90,31,.22);
}
.brand-text h1{
font-size:1.28rem;
line-height:1.05;
font-weight:900;
letter-spacing:-.02em;
}
.brand-text p{
color:var(--muted);
font-size:.92rem;
margin-top:4px;
}
.back-btn{
text-decoration:none;
color:#fff;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.13);
padding:12px 18px;
border-radius:16px;
font-weight:800;
}
.hero{
min-height:360px;
border-radius:34px;
overflow:hidden;
position:relative;
display:grid;
grid-template-columns:1.05fr .95fr;
align-items:stretch;
border:1px solid rgba(255,255,255,.10);
box-shadow:var(--shadow);
background:#090d18;
margin-bottom:24px;
}
.hero::before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(90deg, rgba(5,7,15,.96) 0%, rgba(5,7,15,.82) 42%, rgba(5,7,15,.34) 70%, rgba(5,7,15,.16) 100%),
linear-gradient(180deg, rgba(5,7,15,.12), rgba(5,7,15,.56));
z-index:1;
pointer-events:none;
}
.hero-copy{
position:relative;
z-index:2;
padding:42px 42px;
display:flex;
flex-direction:column;
justify-content:center;
}
.hello{
color:var(--accent-2);
font-weight:900;
font-size:1.1rem;
margin-bottom:14px;
}
.hero h2{
font-size:clamp(2rem, 4vw, 3.6rem);
line-height:1.04;
letter-spacing:-.04em;
max-width:700px;
margin-bottom:16px;
}
.hero p{
color:rgba(255,255,255,.82);
font-size:1.05rem;
line-height:1.7;
max-width:560px;
}
.hero-image{
position:absolute;
inset:0;
background:url('https://movesmart-chile.github.io/movesmart-web/imagenes/contendor.webp') center right / cover no-repeat;
z-index:0;
transform:scale(1.01);
}
.survey-card{
background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.12);
border-radius:32px;
padding:28px;
box-shadow:var(--shadow);
backdrop-filter:blur(6px);
-webkit-backdrop-filter:blur(6px);
}
.survey-head{
display:flex;
justify-content:space-between;
align-items:center;
gap:18px;
margin-bottom:24px;
}
.survey-title{
display:flex;
align-items:center;
gap:14px;
}
.survey-icon{
width:48px;
height:48px;
border-radius:16px;
background:rgba(255,90,31,.14);
border:1px solid rgba(255,90,31,.24);
display:grid;
place-items:center;
font-size:1.35rem;
}
.survey-title h3{
font-size:1.55rem;
margin-bottom:4px;
}
.survey-title p{
color:var(--muted);
}
.progress-wrap{
display:grid;
grid-template-columns:1fr auto;
align-items:center;
gap:22px;
margin:8px 0 22px;
}
.progress-bar{
height:7px;
border-radius:999px;
background:rgba(255,255,255,.08);
overflow:hidden;
}
.progress-fill{
height:100%;
width:0%;
border-radius:999px;
background:linear-gradient(90deg, var(--accent), var(--accent-2));
transition:.25s ease;
}
.progress-text{
color:rgba(255,255,255,.72);
font-size:.98rem;
white-space:nowrap;
}
.question{
padding:26px 0;
border-top:1px solid rgba(255,255,255,.09);
}
.question:first-of-type{border-top:none}
.q-title{
display:flex;
align-items:flex-start;
gap:16px;
margin-bottom:18px;
}
.q-icon{
width:54px;
height:54px;
border-radius:50%;
display:grid;
place-items:center;
background:rgba(255,90,31,.11);
border:1px solid rgba(255,90,31,.24);
color:var(--accent-2);
font-size:1.45rem;
flex:0 0 auto;
}
.q-title h4{
color:var(--accent-2);
font-size:1.24rem;
margin-bottom:6px;
}
.q-title p{
color:var(--muted);
line-height:1.5;
}
.choices{
display:grid;
grid-template-columns:repeat(3, minmax(0,1fr));
gap:18px;
}
.choice{
min-height:132px;
padding:20px 16px;
border-radius:20px;
background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.12);
color:#fff;
cursor:pointer;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
gap:8px;
text-align:center;
font-family:inherit;
transition:.18s ease;
}
.choice:hover{
transform:translateY(-2px);
border-color:rgba(255,90,31,.45);
}
.choice.selected{
background:linear-gradient(180deg, rgba(255,90,31,.24), rgba(255,90,31,.10));
border-color:var(--accent);
box-shadow:0 0 0 1px rgba(255,90,31,.44), 0 16px 28px rgba(255,90,31,.10);
}
.choice .emoji{
font-size:1.7rem;
line-height:1;
}
.choice strong{
font-size:1.22rem;
display:block;
}
.choice span{
color:rgba(255,255,255,.74);
font-size:.94rem;
}
.submit-btn{
margin-top:16px;
width:100%;
border:none;
border-radius:18px;
padding:19px 24px;
background:linear-gradient(180deg, #ff7a1f, #ff4f13);
color:#fff;
font-weight:900;
font-size:1.18rem;
cursor:pointer;
box-shadow:0 16px 34px rgba(255,90,31,.25);
font-family:inherit;
}
.microcopy{
color:rgba(255,255,255,.68);
text-align:center;
margin-top:16px;
font-size:.95rem;
}
.result-card{
display:none;
margin-top:18px;
padding:18px;
border-radius:22px;
background:rgba(29,191,115,.12);
border:1px solid rgba(29,191,115,.28);
color:#ddffea;
line-height:1.65;
}
.result-card.active{display:block}
.quick-stats{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:14px;
margin:22px 0 28px;
}
.stat{
background:rgba(255,255,255,.07);
border:1px solid rgba(255,255,255,.10);
border-radius:20px;
padding:16px;
}
.stat small{
display:block;
color:var(--text-soft, rgba(255,255,255,.82));
margin-bottom:6px;
}
.stat strong{
font-size:1rem;
line-height:1.4;
}
.mode-card{
margin:20px 0 8px;
padding:20px;
border-radius:24px;
background:rgba(255,90,31,.12);
border:1px solid rgba(255,90,31,.26);
color:#ffe0d4;
line-height:1.7;
box-shadow:0 18px 38px rgba(0,0,0,.20);
}
.mode-card strong{color:#fff;display:block;margin-bottom:6px;font-size:1.05rem}
.routine-version-label{
display:inline-flex;
align-items:center;
gap:8px;
margin-bottom:12px;
padding:8px 12px;
border-radius:999px;
background:rgba(255,90,31,.15);
color:#ffd6c8;
border:1px solid rgba(255,90,31,.25);
font-size:.9rem;
font-weight:800;
}
.smart-loading{
display:none;
margin-top:22px;
padding:28px;
border-radius:30px;
background:linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.04));
border:1px solid rgba(255,255,255,.13);
box-shadow:var(--shadow);
text-align:center;
animation:fadeUp .35s ease both;
}
.smart-loading.active{display:block}
.smart-orb{
width:68px;
height:68px;
border-radius:50%;
margin:0 auto 16px;
background:
radial-gradient(circle at 30% 30%, #fff, transparent 24%),
linear-gradient(135deg, var(--accent), var(--accent-2));
box-shadow:0 0 34px rgba(255,90,31,.45);
animation:pulseOrb 1.15s ease-in-out infinite;
}
.smart-loading h3{
font-size:1.35rem;
margin-bottom:8px;
}
.smart-loading p{
color:rgba(255,255,255,.76);
line-height:1.6;
}
.survey-card.is-processing{
opacity:.75;
pointer-events:none;
transition:.25s ease;
}
@keyframes pulseOrb{
0%,100%{transform:scale(.92);opacity:.72}
50%{transform:scale(1.06);opacity:1}
}
.routine-container{
display:none;
margin-top:24px;
animation:fadeUp .35s ease both;
}
.routine-container.active{display:block}
.routine-intro{
margin:22px 0;
padding:26px;
border-radius:30px;
background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.12);
box-shadow:var(--shadow);
}
.routine-intro h2{
font-size:clamp(1.7rem,3vw,2.6rem);
line-height:1.05;
margin-bottom:10px;
letter-spacing:-.03em;
}
.routine-intro p{
color:var(--muted);
line-height:1.7;
max-width:760px;
}
.section{
margin-top:22px;
background:linear-gradient(180deg, rgba(255,255,255,.075), rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.12);
border-radius:30px;
overflow:hidden;
box-shadow:var(--shadow);
}
.section-head{
background:linear-gradient(135deg, rgba(47,99,255,.34), rgba(255,90,31,.18));
padding:20px 24px;
border-bottom:1px solid rgba(255,255,255,.10);
}
.section-head h2{
font-size:1.45rem;
margin-bottom:5px;
}
.section-head p{
color:rgba(255,255,255,.78);
line-height:1.55;
}
.section-body{
padding:20px;
display:grid;
gap:16px;
}
.exercise-card{
background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.12);
border-radius:24px;
padding:20px;
display:grid;
grid-template-columns:1.3fr .9fr;
gap:20px;
align-items:center;
transition:.18s ease;
}
.exercise-card:hover{
transform:translateY(-2px);
border-color:rgba(255,90,31,.38);
}
.exercise-name{
font-size:1.18rem;
font-weight:900;
margin-bottom:8px;
color:#fff;
}
.exercise-desc{
color:rgba(255,255,255,.76);
line-height:1.65;
font-size:.97rem;
}
.exercise-meta{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}
.pill{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.12);
border-radius:16px;
padding:11px 12px;
font-size:.95rem;
color:#fff;
}
.pill span{
display:block;
color:rgba(255,255,255,.62);
font-size:.82rem;
margin-bottom:4px;
}
.video-btn{
display:inline-flex;
align-items:center;
gap:10px;
margin-top:14px;
text-decoration:none;
background:linear-gradient(180deg, #ff7a1f, #ff4f13);
color:#fff;
padding:12px 16px;
border-radius:14px;
font-weight:800;
box-shadow:0 12px 28px rgba(255,90,31,.24);
border:none;
cursor:pointer;
font-family:inherit;
font-size:1rem;
}
.simple-card,.note,.finish-session-text{
background:linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.035));
border:1px solid rgba(255,255,255,.12);
border-radius:22px;
padding:18px;
line-height:1.7;
color:rgba(255,255,255,.84);
}
.note{
margin-top:22px;
background:rgba(29,191,115,.12);
border-color:rgba(29,191,115,.28);
color:#ddffea;
}
.warning{
margin-top:22px;
background:rgba(255,166,35,.12);
border:1px solid rgba(255,166,35,.28);
color:#ffe8b4;
border-radius:22px;
padding:18px;
line-height:1.7;
}
.finish-session-wrap{
margin-top:22px;
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
}
.finish-session-text{
width:100%;
text-align:center;
}
.finish-session-btn{
display:inline-flex;
align-items:center;
justify-content:center;
gap:10px;
text-decoration:none;
background:linear-gradient(180deg,#ff8a1f,#ff5a1f);
color:#fff;
font-weight:900;
font-size:1.05rem;
padding:18px 28px;
border-radius:20px;
box-shadow:0 14px 30px rgba(255,90,31,.28);
border:none;
min-width:320px;
}
.finish-session-wrap,
.finish-session-btn{
pointer-events:auto !important;
}
.finish-session-wrap{
position:relative;
z-index:20;
}
.finish-session-btn{
position:relative;
z-index:21;
cursor:pointer;
}
.video-modal{
position:fixed;
inset:0;
background:rgba(4,6,14,.78);
display:none;
align-items:center;
justify-content:center;
padding:20px;
z-index:9999;
}
.video-modal.active{ display:flex; }
.video-box{
width:min(900px, 100%);
background:linear-gradient(180deg, rgba(18,16,30,.96), rgba(12,11,22,.94));
border:1px solid rgba(255,255,255,.10);
border-radius:24px;
overflow:hidden;
box-shadow:0 18px 40px rgba(0,0,0,.35);
}
.video-box-head{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:16px 18px;
background:rgba(255,255,255,.05);
border-bottom:1px solid rgba(255,255,255,.08);
}
.close-video{
border:none;
background:rgba(255,255,255,.10);
color:#fff;
border-radius:12px;
padding:10px 14px;
cursor:pointer;
font-weight:800;
font-family:inherit;
}
.video-frame-wrap{
position:relative;
width:100%;
padding-top:56.25%;
background:linear-gradient(180deg, rgba(10,10,18,.95), rgba(8,8,14,.98));
}
.video-frame-wrap iframe,
.video-frame-wrap video{
position:absolute;
inset:0;
width:100%;
height:100%;
border:0;
}
.video-frame-wrap video{
display:none;
object-fit:contain;
background:#000;
pointer-events:none;
opacity:1;
transition:opacity .18s ease;
}
.video-frame-wrap video.loop-fade-out{opacity:0}
.video-frame-wrap video::-webkit-media-controls{display:none!important}
@keyframes fadeUp{
from{opacity:0;transform:translateY(14px)}
to{opacity:1;transform:translateY(0)}
}
@media (max-width:900px){
.hero{grid-template-columns:1fr;min-height:360px}
.hero-copy{padding:34px 26px}
.choices{grid-template-columns:1fr}
.survey-head,.progress-wrap{grid-template-columns:1fr;align-items:start}
.progress-text{white-space:normal}
.exercise-card{grid-template-columns:1fr}
.exercise-meta{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
.quick-stats{grid-template-columns:1fr !important;gap:12px !important}
.stat{min-height:auto !important;padding:14px 16px !important;border-radius:18px !important}
.stat strong{font-size:1rem !important;line-height:1.35 !important;word-break:normal !important;overflow-wrap:anywhere !important}
.exercise-card{grid-template-columns:1fr !important;padding:16px !important;border-radius:20px !important}
.exercise-meta{display:flex !important;flex-wrap:wrap !important;gap:8px !important}
.pill{flex:1 1 130px !important;padding:9px 10px !important;border-radius:14px !important}
.finish-session-btn{width:100% !important;min-width:unset !important}
body::before{position:absolute}
.choice:hover,.exercise-card:hover{transform:none}
.smart-orb{animation:none}
}
.video-help-note{margin:18px 0 22px;padding:18px;border-radius:22px;display:flex;align-items:flex-start;gap:14px;background:linear-gradient(180deg,rgba(47,99,255,.13),rgba(255,255,255,.04));border:1px solid rgba(111,142,255,.28);box-shadow:0 12px 26px rgba(0,0,0,.18)}
.video-help-icon{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;background:rgba(47,99,255,.16);border:1px solid rgba(111,142,255,.25);font-size:1.25rem}
.video-help-note strong{display:block;margin-bottom:5px;color:#fff;font-size:1rem}
.video-help-note p{margin:0;color:rgba(255,255,255,.72);line-height:1.55;font-size:.93rem}
.review-request{margin-top:12px;padding:14px;border-radius:17px;background:rgba(47,99,255,.08);border:1px solid rgba(111,142,255,.18)}
.review-request-copy{margin-bottom:11px}
.review-badge{display:block;color:#fff;font-weight:850;margin-bottom:4px;font-size:.94rem}
.review-request small{color:rgba(255,255,255,.65);line-height:1.45;display:block}
.upload-execution-btn{width:100%;border:none;border-radius:14px;padding:12px 14px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);color:#fff;cursor:pointer;font-family:inherit;font-size:.95rem;font-weight:850}
.upload-execution-btn.done{background:rgba(53,208,98,.12);border-color:rgba(53,208,98,.28);color:#dfffe8}
.upload-status{margin-top:8px;color:rgba(255,255,255,.66);font-size:.82rem;line-height:1.4}
.execution-modal{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(4,6,14,.82)}
.execution-modal.active{display:flex}
.execution-dialog{width:min(620px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,rgba(18,20,34,.98),rgba(10,12,22,.98));border:1px solid rgba(255,255,255,.12);border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.execution-head{padding:18px 20px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(255,255,255,.08)}
.execution-head strong{display:block;font-size:1.12rem;margin-bottom:4px}
.execution-head p{color:rgba(255,255,255,.66);line-height:1.4;font-size:.9rem}
.execution-close{border:none;background:rgba(255,255,255,.09);color:#fff;border-radius:12px;padding:9px 12px;cursor:pointer;font-weight:800}
.execution-body{padding:20px}
.execution-tip{padding:14px;border-radius:16px;background:rgba(255,90,31,.10);border:1px solid rgba(255,90,31,.18);color:rgba(255,255,255,.78);line-height:1.55;margin-bottom:16px;font-size:.92rem}
.execution-file-label{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;min-height:72px;padding:16px;border-radius:18px;border:1px dashed rgba(255,255,255,.24);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;font-weight:850}
.execution-file-label input{display:none}
.execution-preview{display:none;width:100%;max-height:340px;object-fit:contain;margin-top:14px;border-radius:16px;background:#000}
.execution-preview.active{display:block}
.selected-video-info{display:none;margin-top:10px;color:#dfffe8;font-size:.88rem}
.selected-video-info.active{display:block}
.execution-comment-label{display:block;margin-top:16px;font-size:.9rem;font-weight:800;color:#fff}
.execution-comment{margin-top:8px;width:100%;min-height:90px;resize:vertical;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:#fff;padding:12px 14px;font:inherit;outline:none}
.execution-actions{display:flex;gap:10px;margin-top:18px}
.execution-cancel,.execution-send{flex:1;border:none;border-radius:15px;padding:13px 14px;font:inherit;font-weight:850;cursor:pointer}
.execution-cancel{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
.execution-send{background:linear-gradient(180deg,#ff7a1f,#ff4f13);color:#fff}
.execution-send:disabled{opacity:.45;cursor:not-allowed}
@media(max-width:640px){.video-help-note{padding:15px;border-radius:18px}.video-help-icon{width:40px;height:40px;flex-basis:40px}.execution-actions{flex-direction:column-reverse}}
.exercise-card > .review-request{
grid-column:1 / -1;
margin-top:0;
}
@media (max-width:640px){
.exercise-card > .review-request{
margin-top:4px;
}
